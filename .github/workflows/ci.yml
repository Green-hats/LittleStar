name: CI

on:
  push:
    branches: [ main, redesign/child-learning ]
  pull_request:
    branches: [ main, redesign/child-learning ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Java-only sources
        run: |
          kotlin_files="$(git ls-files -- '*.kt' '*.kts')"
          if [[ -n "$kotlin_files" ]]; then
            printf 'Unexpected Kotlin files:\n%s\n' "$kotlin_files"
            exit 1
          fi

      - name: Validate content and contrast
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/validate_content.py --require-real-media --skip-rights-checks
          python3 tools/contrast_check.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name != 'push' }}

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"

      - name: Run unit tests and build Debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LittleStar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
