name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install platform 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Content & contrast checks
        run: |
          python3 tools/validate_content.py
          python3 tools/contrast_check.py

      - name: Assert no Kotlin sources
        run: |
          ! find . -path ./build -prune -o \( -name '*.kt' -o -name '*.kts' \) -print | grep -q .

      - uses: actions/upload-artifact@v4
        with:
          name: LittleStar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
